<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="chat-page">
  <header id="chat-status">
    <span class="stat"><span class="plat twitch">T</span> <span id="tw-state" class="muted">…</span></span>
    <span class="stat"><span class="plat youtube">YT</span> <span id="yt-state" class="muted">…</span>
      <a id="yt-connect" href="#" hidden>connect</a></span>
    <span id="modes"></span>
    <button type="button" id="mod-btn" title="Moderation: Twitch chat modes, Shield Mode" aria-expanded="false" hidden>🛡</button>
  </header>

  <section id="modpanel" class="popover" hidden>
    <div class="pop-head"><strong>Twitch chat modes</strong><button type="button" class="pop-close" aria-label="Close">×</button></div>
    <div id="mp-note" class="err" hidden></div>
    <div class="mp-row"><span>Slow mode</span>
      <select id="mp-slow">
        <option value="0">off</option><option value="3">3 s</option><option value="5">5 s</option>
        <option value="10">10 s</option><option value="20">20 s</option><option value="30">30 s</option>
        <option value="60">60 s</option><option value="120">120 s</option>
      </select></div>
    <div class="mp-row"><span>Followers only</span>
      <select id="mp-followers">
        <option value="-1">off</option><option value="0">any follower</option><option value="10">10 min</option>
        <option value="30">30 min</option><option value="60">1 h</option><option value="1440">1 day</option>
        <option value="10080">1 week</option><option value="43200">1 month</option><option value="129600">3 months</option>
      </select></div>
    <label class="mp-row"><span>Subscribers only</span><input type="checkbox" id="mp-subs"></label>
    <label class="mp-row"><span>Emote only</span><input type="checkbox" id="mp-emote"></label>
    <label class="mp-row"><span>Unique chat</span><input type="checkbox" id="mp-unique"></label>
    <div class="mp-actions">
      <button type="button" id="mp-shield" class="mod-btn-shield">Shield Mode: …</button>
      <button type="button" id="mp-clear" class="danger" data-confirm="Really clear?">Clear chat</button>
    </div>
    <div class="muted small">YouTube's API has no chat modes; use YouTube Studio for those. Type <code>/help</code> for commands.</div>
  </section>

  <section id="usercard" class="popover" hidden></section>

  <main id="feed" aria-live="polite"></main>
  <button id="more" hidden>new messages ↓</button>

  <form id="send" autocomplete="off">
    <ul id="ac" role="listbox" hidden></ul>
    <section id="picker" hidden>
      <input id="picker-search" placeholder="Search emotes" aria-label="Search emotes">
      <div id="picker-note" class="muted" hidden></div>
      <div id="picker-list"></div>
    </section>
    <div id="send-error" class="err" hidden></div>
    <div id="send-hint" class="muted" hidden>Emotes show as plain text on YouTube</div>
    <div class="send-row">
      <label class="target twitch" title="Send to Twitch"><input type="checkbox" id="to-twitch" checked><span>T</span></label>
      <label class="target youtube" title="Send to YouTube"><input type="checkbox" id="to-youtube" checked><span>YT</span></label>
      <input id="text" placeholder="Send a message (: for emotes)" maxlength="500">
      <button type="button" id="emote-btn" title="Emotes" aria-label="Emotes" aria-expanded="false">☺</button>
      <span id="count" class="muted"></span>
    </div>
  </form>

<script src="chat.js"></script>
</body>
</html>
