<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stream Info</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1e1e2e; color: #cdd6f4; margin: 12px; font-size: 14px; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  #state { font-weight: bold; }
  .ok { color: #a6e3a1; } .err { color: #f38ba8; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0 0; }
  dt { opacity: .7; }
</style>
</head>
<body>
  <h1>Hello from OBS Stream Info 👋</h1>
  <div>Server: <span id="state">…</span></div>
  <dl>
    <dt>PID</dt><dd id="pid">–</dd>
    <dt>Uptime</dt><dd id="uptime">–</dd>
    <dt>Loads</dt><dd id="loads">–</dd>
    <dt>Threads</dt><dd id="threads">–</dd>
  </dl>
<script>
  const $ = id => document.getElementById(id);
  async function poll() {
    try {
      const r = await fetch('/api/status', { cache: 'no-store' });
      const s = await r.json();
      $('state').textContent = 'online'; $('state').className = 'ok';
      $('pid').textContent = s.pid;
      $('uptime').textContent = s.uptime_s + ' s';
      $('loads').textContent = s.load_count;
      $('threads').textContent = s.threads;
    } catch (e) {
      $('state').textContent = 'offline'; $('state').className = 'err';
    }
  }
  poll(); setInterval(poll, 2000);
</script>
</body>
</html>
