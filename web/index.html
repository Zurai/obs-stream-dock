<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stream Info</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="login" hidden>
    <p id="login-text">Connect your Twitch account to set title and category from here.</p>
    <button id="login-btn" class="primary">Log in with Twitch</button>
    <div id="login-pending" hidden>
      <p>A browser window should have opened. If not, go to<br>
        <a id="login-link" href="#" target="_blank"></a><br>and enter this code:</p>
      <div id="login-code" class="code"></div>
      <p class="muted">Waiting for confirmation …</p>
    </div>
    <p id="login-error" class="err" hidden></p>
  </section>

  <section id="not-configured" hidden>
    <p class="err">No Twitch client ID configured.</p>
    <p class="muted">Create <code>config.local.json</code> next to the script (see README), then reload the script.</p>
  </section>

  <form id="form" hidden autocomplete="off">
    <label for="title">Title <span id="title-count" class="muted"></span></label>
    <input id="title" maxlength="140" placeholder="Stream title">

    <label for="category">Category</label>
    <div class="combo">
      <img id="category-art" alt="">
      <input id="category" placeholder="Search Twitch categories">
      <ul id="suggestions" hidden></ul>
    </div>

    <button id="apply" class="primary" type="submit">Apply</button>
    <ul id="results"></ul>
  </form>

  <footer>
    <span id="server" class="muted">…</span>
    <span id="account" class="muted"></span>
    <a id="logout" href="#" hidden>log out</a>
  </footer>

<script src="app.js"></script>
</body>
</html>
